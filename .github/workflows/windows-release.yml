name: Windows release build

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a draft release for the current version after validation'
        type: boolean
        default: false
  push:
    tags: ['v*']

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          python-version: '3.13'
          enable-cache: true
      - run: uv sync --locked --group build
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      - name: Verify bundled help is current
        run: |
          uv run python scripts/build_help.py
          git diff --exit-code -- src/job_tracker/help/setup.html
      - run: uv build
      - name: Install Inno Setup if unavailable
        shell: pwsh
        run: |
          if (-not (Test-Path 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe')) {
            choco install innosetup --version=6.7.3 --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Build portable app, smoke-test, and create installer
        run: uv run python scripts/build_windows.py --installer
      - name: Download previous validated installer for upgrade coverage
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 37715824397 --name Windows-preview-downloads --dir artifacts/previous-downloads
      - name: Test isolated install, cross-version upgrade, shortcuts, and uninstall
        run: uv run python scripts/test_installer.py --previous-installer artifacts/previous-downloads/Job-Tracker-AI-Setup.exe --check-shortcuts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Windows-release-downloads
          path: dist/release/*
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Windows-release-validation
          path: |
            artifacts/frozen-smoke/*
            artifacts/installer-smoke/*.png
            artifacts/installer-smoke/*.log

  draft-release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.create_release
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Windows-release-downloads
          path: downloads
      - name: Create a draft self-configured release for review
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        shell: pwsh
        run: |
          $files = Get-ChildItem -LiteralPath downloads -File | ForEach-Object FullName
          $version = [regex]::Match((Get-Content -LiteralPath pyproject.toml -Raw), '(?m)^version = "([^"]+)"').Groups[1].Value
          if (-not $version) { throw 'Missing project version' }
          $releaseTag = "v$version"
          if ($env:RELEASE_REF.StartsWith('refs/tags/') -and $env:RELEASE_REF_NAME -ne $releaseTag) { throw 'Tag does not match project version' }
          gh release create $releaseTag @files --target $env:RELEASE_COMMIT --draft --title "Job Tracker AI $releaseTag — self-configured edition" --notes-file docs/preview-release-notes.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
