name: Windows preview build

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          python-version: '3.13'
          enable-cache: true
      - run: uv sync --locked --group build
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      - name: Verify bundled help is current
        run: |
          uv run python scripts/build_help.py
          git diff --exit-code -- src/job_tracker/help/setup.html
      - run: uv build
      - name: Install Inno Setup if unavailable
        shell: pwsh
        run: |
          if (-not (Test-Path 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe')) {
            choco install innosetup --version=6.7.3 --yes --no-progress
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Build portable app, smoke-test, and create installer
        run: uv run python scripts/build_windows.py --installer
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Windows-preview-downloads
          path: dist/release/*
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Windows-preview-validation
          path: artifacts/frozen-smoke/*

  draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: Windows-preview-downloads
          path: downloads
      - name: Create a draft preview release for review
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: pwsh
        run: |
          $files = Get-ChildItem -LiteralPath downloads -File | ForEach-Object FullName
          gh release create $env:RELEASE_TAG @files --verify-tag --draft --prerelease --title "Job Tracker AI $env:RELEASE_TAG — development preview" --notes-file docs/preview-release-notes.md
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
