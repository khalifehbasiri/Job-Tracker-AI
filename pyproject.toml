[project]
name = "job-tracker-ai"
version = "0.2.3"
description = "A local desktop job application tracker with optional email AI and Excel exports"
readme = "README.md"
requires-python = ">=3.13,<3.14"
license = "MIT"
dependencies = [
  "PySide6>=6.8,<7",
  "SQLAlchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "pydantic>=2.10,<3",
  "platformdirs>=4.3,<5",
  "keyring>=25,<26",
  "openpyxl>=3.1,<4",
  "openai>=3.26,<4",
  "httpx>=0.28,<1",
  "google-auth-oauthlib>=1.2,<2",
  "msal>=1.31,<2",
]

[project.scripts]
job-tracker = "job_tracker.main:main"

[dependency-groups]
build = [
    "markdown>=3.7,<4",
    "pyinstaller>=6.22,<7",
]
dev = ["pytest>=8,<10", "pytest-qt>=4.4,<5", "ruff>=0.9,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/job_tracker"]

[tool.hatch.build]
exclude = ["src/job_tracker/google_desktop_oauth.json"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
